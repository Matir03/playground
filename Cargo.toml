[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/engine-server",
    "crates/model-client",
    "crates/games/connect4",
    "crates/games/go9",
    "crates/games/amazons",
    "crates/games/arimaa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Async + server
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-web = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"

# CLI + error + logging
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for on-disk records, configs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numerical / misc
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
bytes = "1"
async-trait = "0.1"

# Intra-workspace
playground-core = { path = "crates/core" }
playground-protocol = { path = "crates/protocol" }
playground-engine-server = { path = "crates/engine-server" }
playground-model-client = { path = "crates/model-client" }
