[package]
name = "go9-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "go9-engine"
path = "src/main.rs"

[dependencies]
playground-core.workspace = true
playground-engine-server.workspace = true
playground-model-client.workspace = true
playground-protocol.workspace = true

tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
bytes.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr = "0.4"

# In-process NN inference (embedded engine, no gRPC round-trips).
candle-core = "0.10"
candle-nn = "0.10"
# api-26 matches the installed libonnxruntime.so.1.26.0; see minions/Cargo.toml.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-26", "load-dynamic", "cuda", "tensorrt"] }

[features]
# Build candle with CUDA kernels for GPU self-play (needs nvcc at build time).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
