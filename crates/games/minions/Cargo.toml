[package]
name = "minions-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "minions_engine"
path = "src/lib.rs"

[[bin]]
name = "minions-engine"
path = "src/main.rs"

[dependencies]
playground-core.workspace = true
playground-engine-server.workspace = true
playground-model-client.workspace = true
playground-protocol.workspace = true

tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
rand.workspace = true
rand_chacha.workspace = true
# Normal draws for `genpos`'s truncated turn-length law.
rand_distr.workspace = true
serde.workspace = true
serde_json.workspace = true
# The CUDA runtime ORT already loaded, for uploads into the device h store.
libloading = "0.8"
# Exact SAT fallback for turn realizability (sat.rs): CaDiCaL, incremental
# with assumptions.
cadical = "0.1.16"
# Opt-in global allocator (`--features mimalloc`); see main.rs.
mimalloc = { version = "0.1", optional = true, default-features = false }

# In-process NN inference, as for hex/amazons: the gRPC model server is ~40x
# slower than an embedded net, so nothing on a training path goes through it.
candle-core = "0.10"
candle-nn = "0.10"
# ONNX Runtime backend (CUDA / TensorRT EP) for fast self-play; the shared lib is
# located at runtime via ORT_DYLIB_PATH.
# api-26 pins the ONNX Runtime C API level to the runtime actually installed
# (python/.venv ships libonnxruntime.so.1.26.0). rc.13's default features would
# request api-27 from a 1.26 library. `download-binaries` is dropped because
# `load-dynamic` resolves the library at runtime via ORT_DYLIB_PATH.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-26", "load-dynamic", "cuda", "tensorrt", "half"] }
half = "2"
# Fast hashing for the exact search's transposition keys (SipHash was ~6% of
# option building).
foldhash = "0.2"

[features]
# Build candle with CUDA kernels for GPU self-play (needs nvcc at build time).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# mimalloc as the global allocator, for the self-play malloc churn.
mimalloc = ["dep:mimalloc"]
