[package]
name = "hex-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hex_engine"
path = "src/lib.rs"

[[bin]]
name = "hex-engine"
path = "src/main.rs"

[dependencies]
playground-core.workspace = true
playground-engine-server.workspace = true
playground-model-client.workspace = true
playground-protocol.workspace = true

tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
bytes.workspace = true

# In-process NN inference (embedded engine, no gRPC round-trips).
candle-core = "0.10"
candle-nn = "0.10"

[features]
# Build candle with CUDA kernels for GPU self-play (needs nvcc at build time).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
