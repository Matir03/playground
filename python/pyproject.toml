[project]
name = "playground"
version = "0.1.0"
description = "MuZero-variant research playground: training, model server, orchestrator, eval"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.28",
    "pydantic>=2.9",
    "numpy>=2.0",
]

[project.optional-dependencies]
model = [
    "torch>=2.4",
    "safetensors>=0.4",
]
orchestrator = [
    "typer>=0.12",
    "rich>=13.8",
]
training = [
    "torch>=2.4",
    "safetensors>=0.4",
    "tqdm>=4.66",
]
eval = [
    "scipy>=1.14",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "mypy>=1.11",
]

[project.scripts]
playground-model-server = "playground.model_server.server:main"
playground-orchestrator = "playground.orchestrator.cli:main"
playground-train = "playground.training.cli:main"
playground-eval = "playground.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.ruff]
line-length = 100
target-version = "py311"
