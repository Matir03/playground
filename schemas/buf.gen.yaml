version: v2
inputs:
  - directory: proto
plugins:
  # TypeScript types + Connect v2 service descriptors for the web frontend.
  # The bufbuild/es plugin emits GenService descriptors in _pb.ts, which is
  # what Connect v2's createClient expects — no separate connectrpc/es plugin
  # needed.
  - remote: buf.build/bufbuild/es
    out: ../web/src/gen
    opt:
      - target=ts

  # Python types + grpcio stubs for orchestrator / model server / training.
  - remote: buf.build/protocolbuffers/python
    out: ../python/src/playground/gen
  - remote: buf.build/protocolbuffers/pyi
    out: ../python/src/playground/gen
  - remote: buf.build/grpc/python
    out: ../python/src/playground/gen
