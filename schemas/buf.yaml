version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Allow shared request/response message types across RPCs (e.g. GameHandle,
    # GameState, Run, ModelVersion are reused intentionally). Standard naming
    # would force per-RPC wrapper messages with no semantic value.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # We deliberately dropped the v1 package suffix (see "get rid of v1").
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
