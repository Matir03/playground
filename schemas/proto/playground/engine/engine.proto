syntax = "proto3";

package playground.engine;

import "playground/game/game.proto";

service EngineService {
  // Interactive mode
  rpc NewGame(NewGameRequest) returns (playground.game.GameHandle);
  rpc GetState(playground.game.GameHandle) returns (playground.game.GameState);
  rpc ApplyMove(ApplyMoveRequest) returns (playground.game.GameState);
  rpc RequestMove(RequestMoveRequest) returns (stream MoveProgress);

  // Engine-vs-engine / engine-vs-model match
  rpc PlayMatch(MatchSpec) returns (stream MatchProgress);

  // Batched self-play. Engine internally runs many games; streams
  // notifications as each game completes.
  rpc StartSelfPlay(SelfPlaySpec) returns (stream SelfPlayProgress);

  // Analysis: run the net and the search on a position and report what they
  // saw, without playing anything. The handle's game is left untouched.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // Commit one whole turn to the handle's game, as an opaque encoding from
  // `AnalyzeEdge.turn`. Unlike Analyze this *does* advance the game: it is how
  // an analysis view plays a line it likes and re-roots on the result.
  rpc ApplyTurn(ApplyTurnRequest) returns (playground.game.GameState);

  // The search analysis and the engine's net seat run, every setting by name,
  // alongside the one the engine started with (self-play's recorded search).
  // JSON because the settings are the game's own, not a message per game.
  rpc GetSearchConfig(GetSearchConfigRequest) returns (SearchConfig);
  // Replace that search, or restore the one the engine started with.
  rpc SetSearchConfig(SetSearchConfigRequest) returns (SearchConfig);

  // A persistent analysis session: a search kept alive between calls, so a
  // reader can run it a few simulations at a time, force visits down lines of
  // their choosing, and add turns of their own. `session = 0` starts one.
  rpc Session(SessionRequest) returns (SessionResponse);

  // Health / capabilities
  rpc Health(HealthRequest) returns (HealthResponse);
}

message NewGameRequest {
  playground.game.GameId game_id = 1;
  // Optional non-default starting position.
  optional playground.game.GameState initial_state = 2;
}

message ApplyMoveRequest {
  playground.game.GameHandle handle = 1;
  playground.game.Move move = 2;
}

// Which built-in mover answers a RequestMove. Lets the UI pick per move.
enum EnginePlayer {
  ENGINE_PLAYER_UNSPECIFIED = 0;  // engine default (perfect solver)
  ENGINE_PLAYER_SOLVER = 1;       // perfect solver / opening book
  ENGINE_PLAYER_NN = 2;           // neural-network model (via model server)
  // External reference engine the game crate drives itself (e.g. MoHex over
  // GTP for Hex). Only answers if that engine was configured at startup.
  ENGINE_PLAYER_EXTERNAL = 3;
}

message RequestMoveRequest {
  playground.game.GameHandle handle = 1;
  SearchBudget budget = 2;
  EnginePlayer player = 3;
  // Which NN model to use when player = NN (engine-defined name, e.g.
  // "random" / "trained"). Empty = the engine's default model.
  string model = 4;
}

message SearchBudget {
  // Set exactly one of these.
  optional uint32 max_visits = 1;
  optional uint32 max_millis = 2;
  optional uint32 max_nodes = 3;
}

// Streamed intermediate updates while the engine thinks.
message MoveProgress {
  oneof kind {
    SearchStats stats = 1;
    playground.game.Move chosen = 2;
  }
}

message SearchStats {
  uint32 visits = 1;
  uint32 reifications = 2;
  double best_value = 3;
}

message MatchSpec {
  playground.game.GameId game_id = 1;
  string first_player_uri = 2;     // "model://name@v", "engine://host:port", "human://session"
  string second_player_uri = 3;
  uint32 num_games = 4;
  SearchBudget budget = 5;
}

message MatchProgress {
  oneof kind {
    MatchMove move = 1;
    MatchGameEnd game_end = 2;
    MatchMatchEnd match_end = 3;
  }
}

message MatchMove {
  uint32 game_index = 1;
  playground.game.Player by = 2;
  playground.game.Move move = 3;
}

message MatchGameEnd {
  uint32 game_index = 1;
  playground.game.Outcome outcome = 2;
}

message MatchMatchEnd {
  uint32 first_wins = 1;
  uint32 second_wins = 2;
  uint32 draws = 3;
}

message SelfPlaySpec {
  playground.game.GameId game_id = 1;
  string run_id = 2;
  string model_version = 3;        // pinned version; engine refuses to start if server disagrees
  uint32 parallel_games = 4;
  uint32 target_games = 5;         // 0 = until stopped
  SearchBudget per_move_budget = 6;
  // Where to write GameRecord files.
  string records_dir = 7;
}

message SelfPlayProgress {
  oneof kind {
    SelfPlayGameComplete game_complete = 1;
    SelfPlayStats stats = 2;
  }
}

message SelfPlayGameComplete {
  string record_id = 1;
  string record_path = 2;
  playground.game.Outcome outcome = 3;
  uint32 plies = 4;
}

message SelfPlayStats {
  uint32 games_in_flight = 1;
  uint32 games_completed = 2;
  double games_per_second = 3;
}

message ApplyTurnRequest {
  playground.game.GameHandle handle = 1;
  // Opaque whole-turn encoding, as returned in `AnalyzeEdge.turn`.
  bytes turn = 2;
}

message AnalyzeRequest {
  playground.game.GameHandle handle = 1;
  // Turns to apply to the handle's current state before analysing, so the UI
  // can walk a variation without mutating the game. Empty = analyse as-is.
  //
  // Opaque turn encodings as returned in `AnalyzeEdge.turn`, not
  // `playground.game.Move`: the search's action is a whole turn, which is a
  // *sequence* of moves, so a variation cannot be expressed as a move list
  // without the client reconstructing the realizer.
  repeated bytes line = 2;
  SearchBudget budget = 3;
  // 0 = the engine's configured search.
  uint32 candidates = 4;
  // Skip the search and return only the position's evaluation. Walking a
  // variation asks for this on every click; a full search per click would make
  // the tree unusable to click through.
  bool eval_only = 5;
  // KR-PUCT kernel bandwidth. 0 = the engine's configured search (see
  // GetSearchConfig). Above 0, candidates pool visits and values with their
  // neighbours under `move_distance`, and `AnalyzeNode.kernel` comes back
  // populated.
  float kernel_sigma = 6;
  // Run the engine's fast search -- the cheaper one self-play plays most turns
  // with -- instead of its full one.
  bool fast = 7;
}

// A node of the search tree, flattened. `nodes[0]` is the root.
message AnalyzeNode {
  // Absent on the root.
  optional uint32 parent = 1;
  uint32 total_visits = 2;
  // Mean value over this node's visits, from the side to move here. Absent
  // when the node was never visited.
  optional double value = 3;
  bool terminal = 4;
  double term_value = 5;
  repeated AnalyzeEdge edges = 6;
  // Row-major `k x k` KR-PUCT kernel over `edges`, in `edges` order. Empty when
  // the kernel is off, which is the default. Entry `(i, j)` is the weight with
  // which candidate `i` borrows candidate `j`'s statistics during selection.
  repeated float kernel = 7;
  // The value head here, from the side to move here: what the node's expansion
  // backed up. `value` is the search's mean over the node's visits. Absent
  // until the node has been expanded.
  optional double prior_value = 8;
}

message AnalyzeEdge {
  // Opaque whole-turn encoding; pass back in `AnalyzeRequest.line` to walk here.
  bytes turn = 1;
  // Prior probability, normalised over this node's candidate set.
  double prior = 2;
  // Raw `f(s,a)` as the energy head reported it, before any softmax. The scale
  // has no absolute meaning: the head is trained by a softmax cross-entropy
  // over the candidate set, which is invariant to a per-state additive shift,
  // so only *differences* within a node are interpretable. Clients that display
  // it should subtract the node's maximum.
  double energy = 3;
  uint32 visits = 4;
  // Absent when the edge was never visited — distinct from a value of 0.
  optional double value = 5;
  // Index into `AnalyzeResponse.nodes`, when this edge has been expanded.
  optional uint32 child = 6;
  bool explore = 7;
  uint32 forced = 8;
  // Human-readable rendering of the whole turn, for the tree view.
  string label = 9;
  // Sampler draws that produced this candidate: 1 for the draw that created
  // it, plus every later draw that reached the same position and merged into
  // it. A node holding fewer candidates than it asked for is one whose draws
  // kept repeating, and this is where that shows.
  uint32 draws = 10;
  // The value head's estimate of the position this turn leads to, from the
  // side to move at the parent: what the edge's first visit backed up, before
  // any search below it. `value` is the search's mean over every visit. Absent
  // until the child has been evaluated.
  optional double prior_value = 11;
  // Added by hand in an analysis session rather than proposed by the model.
  bool manual = 12;
}

// What the auxiliary heads see. Probabilities, not logits: the sigmoid is
// applied engine-side so every consumer agrees on it.
//
// Both heads are *perspective-relative*: the training target is built with
// `sides = [side_to_move, opponent]`, so channel 0 belongs to whoever is to
// move in `AnalyzeResponse.state`, not to the first player. A consumer that
// paints channel 0 as one colour throughout has the two sides swapped on
// every position where the other side is to move.
message AnalyzeAux {
  // Per-cell probability that the side holds the hex over the rest of the
  // game, row-major over cells.
  repeated double hex_control_mover = 1;
  repeated double hex_control_opponent = 2;
  // Per-side-turn probability the necromancer is *dead* by that turn, over the
  // auxiliary head's horizon. Hazard, not survival — the target stores
  // `u8::from(dead)`, so the curve rises as death becomes more likely.
  repeated double necro_hazard_mover = 3;
  repeated double necro_hazard_opponent = 4;
  // The trajectory-balance log-partition estimate for this position.
  double log_z = 5;
  // Predicted terminal score in points from the mover's seat: net-worth
  // differential plus 10 per turn the game finishes before the cap.
  double score = 6;
}

message AnalyzeResponse {
  // The position analysed, after `line` was applied.
  playground.game.GameState state = 1;
  // Value head, from the side to move's perspective.
  double value = 2;
  // Absent when the engine has no aux graph (an older exported net).
  optional AnalyzeAux aux = 3;
  // Empty when `eval_only` was set.
  repeated AnalyzeNode nodes = 4;
  // Index into `nodes[0].edges` of the move the search would play.
  optional uint32 chosen = 5;
}

message SessionRequest {
  // 0 = start a new session on the handle's position after `line`.
  uint64 session = 1;
  // Starting only.
  playground.game.GameHandle handle = 2;
  repeated bytes line = 3;
  bool fast = 4;
  oneof op {
    // Run this many simulations. Starting: 0 = the configured budget, 1 =
    // expand the root and stop.
    uint32 simulations = 5;
    ForceVisit force = 6;
    AddChild add = 7;
  }
}

// One simulation forced down `line` -- turn encodings from the session root,
// the last being the edge to force through -- with PUCT below it. Every edge
// on the line counts the visit as forced.
message ForceVisit {
  repeated bytes line = 1;
}

// Add a turn to the node `at` reaches (turn encodings from the session root;
// empty = the root). `moves` are `playground.game.Move` payloads played from
// that node, making one whole turn.
message AddChild {
  repeated bytes at = 1;
  repeated bytes moves = 2;
}

message SessionResponse {
  uint64 session = 1;
  // The session's tree, rooted at the session's root.
  AnalyzeResponse analysis = 2;
  // After an AddChild: the turn as it now sits in the tree -- the realizer's
  // reading of what was played.
  optional bytes added = 3;
  // Anything the reader should know about the request.
  string note = 4;
}

message GetSearchConfigRequest {}

message SetSearchConfigRequest {
  // Every setting, spelled as `SearchConfig.json` spells them. Ignored with
  // `reset`.
  string json = 1;
  // Restore the search the engine started with.
  bool reset = 2;
}

message SearchConfig {
  // The search in effect.
  string json = 1;
  // The search the engine started with.
  string default_json = 2;
}

message HealthRequest {}

message HealthResponse {
  string version = 1;
  repeated playground.game.GameId supported_games = 2;
}
